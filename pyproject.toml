[project]
name = "bring-your-own-vlm-ocr"
version = "0.1.0"
description = "A provider-agnostic Vision OCR web app with live streaming and interactive bounding-box text spotting, powered by any OpenAI-compatible VLM endpoint."
readme = "README.md"
authors = [
    { name = "Marco Yap", email = "marcochristian@mail.ugm.ac.id" }
]
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "openai>=3.46.0",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
bring-your-own-vlm-ocr = "bring_your_own_vlm_ocr:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
